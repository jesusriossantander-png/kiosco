<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Promo</title>
<style>
  :root { --teal: #0f766e; --teal2: #14b8a6; --deep: #0b3f3b; --amber: #f59e0b; --amber2: #fbbf24; --ink: #10201e; --cream: #fff8ec; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: #000; }
  body { font-family: "Inter Display", Inter, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 540px; height: 960px; overflow: hidden; }
  .sc { position: absolute; inset: 0; opacity: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 120px 34px 0; }
  .bg-amber { background: radial-gradient(700px 500px at 80% 10%, #fde68a, transparent 60%), linear-gradient(165deg, #fbbf24, #f59e0b 55%, #ea580c); color: var(--ink); }
  .bg-teal { background: radial-gradient(800px 520px at 90% -5%, #2dd4bf, transparent 60%), linear-gradient(165deg, #0f766e, #0b3f3b); }
  .bg-deep { background: radial-gradient(700px 600px at 10% 0%, #134e4a, transparent 60%), linear-gradient(170deg, #0b1f1d, #06110f); }
  .bg-cream { background: radial-gradient(700px 520px at 85% 0%, #fde68a, transparent 55%), var(--cream); color: var(--ink); }
  .bg-red { background: radial-gradient(700px 500px at 20% 0%, #fb7185, transparent 60%), linear-gradient(165deg, #e11d48, #9f1239); }
  [data-a], [data-kb], [data-float], [data-pulse] { will-change: transform, opacity; }
  .t-xl { font-weight: 900; font-size: 64px; line-height: .98; letter-spacing: -2px; text-align: center; }
  .t-l { font-weight: 900; font-size: 46px; line-height: 1.02; letter-spacing: -1.4px; text-align: center; }
  .t-m { font-weight: 800; font-size: 30px; line-height: 1.12; letter-spacing: -.6px; text-align: center; }
  .t-s { font-weight: 600; font-size: 20px; line-height: 1.3; text-align: center; opacity: .92; }
  .hl { color: var(--amber2); }
  .hl-teal { color: var(--teal); }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.35); padding: 8px 16px; border-radius: 99px; font-weight: 700; font-size: 18px; }
  .chip.dark { background: rgba(16,32,30,.08); border-color: rgba(16,32,30,.18); }
  .emo { position: absolute; font-size: 74px; filter: drop-shadow(0 12px 18px rgba(0,0,0,.25)); }
  .tile { position: absolute; width: 112px; height: 112px; border-radius: 30px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 66px; box-shadow: 0 18px 36px rgba(0,0,0,.22); }
  /* Teléfono */
  .phone { position: absolute; width: 300px; height: 650px; border-radius: 48px; background: #0d0d0d; padding: 11px; box-shadow: 0 40px 80px rgba(0,0,0,.45), inset 0 0 0 2px #333; }
  .phone .scr { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #0f766e; }
  .phone .scr img { position: absolute; left: 0; right: 0; top: 34px; width: 100%; height: calc(100% - 34px); object-fit: cover; object-position: top; }
  .phone::after { content: ''; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 20px; background: #0d0d0d; }
  /* Notebook */
  .laptop { position: absolute; width: 500px; }
  .laptop .lid { background: #111; border-radius: 18px 18px 6px 6px; padding: 10px 10px 14px; box-shadow: 0 30px 70px rgba(0,0,0,.5), inset 0 0 0 2px #2b2b2b; }
  .laptop .scr { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 6px; background: #f3f5f7; }
  .laptop .scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .laptop .base { height: 16px; margin: 0 -26px; background: linear-gradient(#d9dde1, #9ca3af); border-radius: 0 0 22px 22px; position: relative; }
  .laptop .base::before { content: ''; position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 90px; height: 6px; background: #8b929b; border-radius: 0 0 8px 8px; }
  /* Ofertas */
  .ofs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; margin-top: 34px; }
  .of { position: relative; background: #fff; color: var(--ink); border-radius: 26px; padding: 16px; box-shadow: 0 18px 34px rgba(0,0,0,.25); }
  .of .e { height: 112px; border-radius: 18px; background: #f1f5f4; display: flex; align-items: center; justify-content: center; font-size: 66px; }
  .of .pct { position: absolute; top: 10px; right: 10px; background: #e11d48; color: #fff; font-weight: 900; font-size: 20px; padding: 6px 12px; border-radius: 99px; }
  .of .tg { display: inline-block; margin-top: 10px; background: #d5f2ee; color: var(--teal); font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 99px; }
  .of h4 { font-size: 17px; font-weight: 800; margin-top: 6px; letter-spacing: -.3px; }
  .of s { color: #7b8794; font-size: 15px; font-weight: 600; display: block; margin-top: 4px; }
  .of b { color: var(--teal); font-size: 27px; font-weight: 900; letter-spacing: -.6px; }
  /* Filas de beneficios */
  .rows { display: grid; gap: 18px; width: 100%; margin-top: 46px; }
  .row { display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.22); border-radius: 26px; padding: 20px 22px; }
  .bg-cream .row { background: #fff; border-color: #eadfcb; box-shadow: 0 12px 26px rgba(0,0,0,.08); }
  .row .i { font-size: 46px; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.18); border-radius: 20px; flex: none; }
  .bg-cream .row .i { background: #fef3c7; }
  .row b { font-size: 25px; font-weight: 900; letter-spacing: -.5px; display: block; }
  .row span { font-size: 17px; opacity: .85; font-weight: 600; }
  .steps { display: flex; gap: 10px; position: absolute; left: 24px; right: 24px; bottom: 150px; }
  .step { flex: 1; background: #fff; color: var(--ink); border-radius: 20px; padding: 12px 10px; text-align: center; font-weight: 800; font-size: 16px; box-shadow: 0 14px 28px rgba(0,0,0,.25); }
  .step i { font-style: normal; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--amber); margin: 0 auto 6px; font-weight: 900; font-size: 18px; }
  .cta { display: inline-flex; align-items: center; gap: 10px; background: var(--amber); color: #1f1300; font-weight: 900; font-size: 32px; padding: 20px 38px; border-radius: 99px; box-shadow: 0 18px 40px rgba(245,158,11,.45); letter-spacing: -.5px; }
  .url { font-weight: 700; font-size: 17px; background: rgba(255,255,255,.14); padding: 10px 16px; border-radius: 14px; letter-spacing: .1px; }
  .logo { width: 128px; height: 128px; border-radius: 34px; box-shadow: 0 20px 40px rgba(0,0,0,.35); }
  .checks { display: grid; gap: 12px; margin-top: 30px; }
  .checks div { font-size: 24px; font-weight: 800; display: flex; gap: 12px; align-items: center; }
  .checks div::before { content: '✓'; width: 36px; height: 36px; border-radius: 50%; background: #22c55e; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; }
  .sk { position: relative; display: inline-block; }
  .strike { position: absolute; left: -8px; right: -8px; top: 50%; height: 9px; background: #e11d48; border-radius: 6px; transform-origin: left center; }
  .cap { position: absolute; left: 30px; right: 30px; text-align: center; }
  .badge-big { display: inline-block; background: #fff; color: var(--ink); font-weight: 900; font-size: 24px; padding: 12px 20px; border-radius: 18px; box-shadow: 0 14px 28px rgba(0,0,0,.3); }
  .ticket { position: absolute; width: 300px; left: 120px; top: 260px; overflow: hidden; border-radius: 4px; filter: drop-shadow(0 26px 40px rgba(0,0,0,.45)); }
  .ticket img { width: 100%; display: block; }
  .printer { position: absolute; left: 90px; top: 220px; width: 360px; height: 58px; background: linear-gradient(#374151, #111827); border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
  .printer::after { content: ''; position: absolute; left: 26px; right: 26px; bottom: 12px; height: 8px; background: #000; border-radius: 6px; }
  #bar { position: absolute; left: 0; top: 0; height: 6px; background: var(--amber2); z-index: 10; }
  .wm { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-weight: 800; font-size: 15px; opacity: .7; z-index: 9; letter-spacing: .3px; }
</style></head>

  duenos: { dur: 32, scenes: [

      <div class="emo" style="left:200px;top:470px;font-size:130px" data-a="pop" data-d=".5" data-shake="1">📒</div>
      <div class="t-m" style="position:absolute;top:700px;left:30px;right:30px" data-a="up" data-d="2.1">Hay una forma <span class="hl">mejor</span> 👇</div>` },

/* ---------- Motor de animación (determinista: render(t) dibuja el cuadro t) ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eOut = p => 1 - Math.pow(1 - p, 3);
const eBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const video = VIDEOS[V];
const stage = document.getElementById('stage');
let t0 = 0;
const scenes = video.scenes.map(s => {
  const el = document.createElement('div');
  el.className = 'sc ' + s.bg;
  el.innerHTML = s.html;
  stage.append(el);
  const o = { ...s, el, start: t0, end: t0 + s.d, items: [...el.querySelectorAll('[data-a],[data-kb],[data-float],[data-pulse],[data-shake]')] };
  t0 += s.d;
  return o;
});
video.dur = t0;
const bar = document.createElement('div'); bar.id = 'bar'; stage.append(bar);
const wm = document.createElement('div'); wm.className = 'wm'; stage.append(wm);

function render(t) {
  bar.style.width = (t / video.dur * 100) + '%';
  for (const s of scenes) {
    const lt = t - s.start;
    const vis = lt >= -0.001 && t < s.end + 0.3;
    if (!vis) { s.el.style.opacity = 0; s.el.style.display = 'none'; continue; }
    s.el.style.display = 'flex';
    const inP = eOut(clamp(lt / 0.3));

    s.el.style.opacity = s === scenes[0] ? (1 - outP) : inP * (1 - outP);
    s.el.style.zIndex = scenes.indexOf(s);
    s.el.style.transform = `scale(${1.04 - 0.04 * inP + 0.03 * outP})`;
    for (const el of s.items) {
      const a = el.dataset.a, d = +(el.dataset.d || 0), u = +(el.dataset.u || 0.5);
      const p = clamp((lt - d) / u);
      let op = 1, x = 0, y = 0, sc = 1, rot = 0, extra = '';
      if (a === 'up') { const q = eOut(p); op = q; y = 40 * (1 - q); }
      else if (a === 'rise') { const q = eOut(p); op = clamp(p * 2); y = 380 * (1 - q); }
      else if (a === 'pop') { const q = eBack(p); op = clamp(p * 3); sc = 0.3 + 0.7 * q; }
      else if (a === 'fade') { op = eOut(p); }
      else if (a === 'slideR') { const q = eOut(p); op = q; x = -260 * (1 - q); }
      else if (a === 'slideL') { const q = eOut(p); op = q; x = 260 * (1 - q); }
      else if (a === 'strike') { op = p > 0 ? 1 : 0; extra = `scaleX(${eOut(p)})`; }
      else if (a === 'print') { op = p > 0 ? 1 : 0; el.style.clipPath = `inset(0 0 ${100 - eOut(p) * 100}% 0)`; y = -40 + 40 * eOut(p); }
      if (el.dataset.out) { const q = clamp((lt - +el.dataset.out) / 0.25); op *= 1 - q; y -= 20 * q; }
      if (el.dataset.kb) sc *= 1 + 0.06 * clamp(lt / s.d);
      if (el.dataset.float) y += Math.sin(lt * 2.2 + +el.dataset.float) * 7;
      if (el.dataset.pulse) sc *= 1 + 0.045 * Math.max(0, Math.sin(lt * 5.5));
      if (el.dataset.shake && lt > d + 0.4 && lt < 1.6) rot = Math.sin(lt * 40) * 6;
      el.style.opacity = op;
      el.style.transform = `translate(${x}px, ${y}px) scale(${sc}) rotate(${rot}deg) ${extra}`;
    }
  }
}
